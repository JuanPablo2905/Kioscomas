services:
  - type: web
    runtime: static
    name: kiosco-plus
    buildCommand: pnpm install --frozen-lockfile --ignore-scripts && pnpm run build:public
    staticPublishPath: ./dist-public
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: Permissions-Policy
        value: camera=(self), microphone=(), geolocation=()
      - path: /*
        name: X-Frame-Options
        value: SAMEORIGIN
  - type: web
    runtime: node
    name: kiosco-plus-api
    plan: free
    buildCommand: echo "Servidor Kiosco+ listo"
    startCommand: node server/cloud-server.mjs
    healthCheckPath: /v1/health
    envVars:
      - key: KIOSCO_LOCAL_MODE
        value: "0"
      - key: KIOSCO_SUPERADMIN_USERNAME
        value: kiosco-admin
      - key: KIOSCO_SUPERADMIN_PASSWORD
        sync: false
