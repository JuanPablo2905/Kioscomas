services:
  - type: web
    runtime: static
    name: Kioscomas
    buildCommand: pnpm install --frozen-lockfile --ignore-scripts && pnpm run build:cloud-app
    staticPublishPath: ./dist-cloud-app
    routes:
      - type: rewrite
        source: /pantalla
        destination: /pantalla.html
      - type: rewrite
        source: /descargas
        destination: /descargas.html
      - type: rewrite
        source: /funciones
        destination: /funciones.html
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: Permissions-Policy
        value: camera=(self), microphone=(), geolocation=(self)
      - path: /*
        name: X-Frame-Options
        value: SAMEORIGIN
      - path: /*
        name: Strict-Transport-Security
        value: max-age=31536000; includeSubDomains
  - type: web
    runtime: node
    name: kiosco-plus-api
    plan: starter
    buildCommand: pnpm install --frozen-lockfile --prod --ignore-scripts
    startCommand: node server/cloud-server.mjs
    healthCheckPath: /v1/health
    envVars:
      - key: KIOSCO_LOCAL_MODE
        value: "0"
      - key: KIOSCO_REQUIRE_DEVICE_ACTIVATION
        value: "1"
      - key: KIOSCO_SUPERADMIN_USERNAME
        value: kiosco-admin
      - key: KIOSCO_SUPERADMIN_PASSWORD
        sync: false
      - key: KIOSCO_SUPERADMIN_EMAIL
        sync: false
      - key: KIOSCO_RESEND_API_KEY
        sync: false
      - key: KIOSCO_EMAIL_FROM
        sync: false
      - key: KIOSCO_EMAIL_REPLY_TO
        sync: false
      - key: KIOSCO_PUBLIC_APP_URL
        value: https://app.kioscomas.ar
      - key: KIOSCO_PUBLIC_DISPLAY_URL
        value: https://kioscomas.ar/pantalla
      - key: KIOSCO_PASSWORD_RESET_MINUTES
        value: "30"
      - key: KIOSCO_ACCESS_TOKEN_HOURS
        value: "2"
      - key: KIOSCO_ALLOWED_ORIGINS
        value: https://app.kioscomas.ar,https://kioscomas.ar,https://www.kioscomas.ar
      - key: KIOSCO_VAPID_PUBLIC_KEY
        sync: false
      - key: KIOSCO_VAPID_PRIVATE_KEY
        sync: false
      - key: KIOSCO_VAPID_SUBJECT
        value: mailto:soporte@kioscomas.ar
      - key: KIOSCO_MERCADOPAGO_BACKEND_ENABLED
        sync: false
      - key: KIOSCO_MERCADOPAGO_TEST_MODE
        value: "1"
      - key: KIOSCO_MERCADOPAGO_QR_CLIENT_ID
        sync: false
      - key: KIOSCO_MERCADOPAGO_QR_CLIENT_SECRET
        sync: false
      - key: KIOSCO_MERCADOPAGO_QR_WEBHOOK_SECRET
        sync: false
      - key: KIOSCO_MERCADOPAGO_POINT_CLIENT_ID
        sync: false
      - key: KIOSCO_MERCADOPAGO_POINT_CLIENT_SECRET
        sync: false
      - key: KIOSCO_MERCADOPAGO_POINT_WEBHOOK_SECRET
        sync: false
      # Variables anteriores: el servidor las interpreta sólo como QR.
      - key: KIOSCO_MERCADOPAGO_CLIENT_ID
        sync: false
      - key: KIOSCO_MERCADOPAGO_CLIENT_SECRET
        sync: false
      - key: KIOSCO_MERCADOPAGO_REDIRECT_URI
        value: https://kiosco-plus-api.onrender.com/v1/payments/mercado-pago/oauth/callback
      - key: KIOSCO_MERCADOPAGO_RETURN_URI
        value: https://app.kioscomas.ar
      - key: KIOSCO_MERCADOPAGO_TOKEN_ENCRYPTION_KEY
        sync: false
      - key: KIOSCO_MERCADOPAGO_WEBHOOK_SECRET
        sync: false
      - key: KIOSCO_MERCADOPAGO_PLATFORM_ID
        sync: false
      - key: KIOSCO_MERCADOPAGO_INTEGRATOR_ID
        sync: false
      - key: KIOSCO_MERCADOPAGO_SPONSOR_ID
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: KIOSCO_BACKUP_RETENTION_DAYS
        value: "7"
