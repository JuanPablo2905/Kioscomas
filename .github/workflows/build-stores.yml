name: Preparar paquetes para tiendas

on:
  workflow_dispatch:
    inputs:
      target:
        description: Paquete a generar
        required: true
        type: choice
        options: [microsoft-store, google-play]

permissions:
  contents: read

jobs:
  microsoft-store:
    if: inputs.target == 'microsoft-store'
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with: { node-version: 22 }
      - name: Preparar pnpm
        shell: pwsh
        run: |
          corepack enable
          corepack prepare pnpm@11.9.0 --activate
      - run: pnpm install --frozen-lockfile
      - run: pnpm run release:verify -- --microsoft-store
        env:
          MICROSOFT_STORE_IDENTITY_NAME: ${{ secrets.MICROSOFT_STORE_IDENTITY_NAME }}
          MICROSOFT_STORE_PUBLISHER: ${{ secrets.MICROSOFT_STORE_PUBLISHER }}
          MICROSOFT_STORE_PUBLISHER_DISPLAY_NAME: ${{ secrets.MICROSOFT_STORE_PUBLISHER_DISPLAY_NAME }}
      - run: pnpm run desktop:build:store
        env:
          MICROSOFT_STORE_IDENTITY_NAME: ${{ secrets.MICROSOFT_STORE_IDENTITY_NAME }}
          MICROSOFT_STORE_PUBLISHER: ${{ secrets.MICROSOFT_STORE_PUBLISHER }}
          MICROSOFT_STORE_PUBLISHER_DISPLAY_NAME: ${{ secrets.MICROSOFT_STORE_PUBLISHER_DISPLAY_NAME }}
      - uses: actions/upload-artifact@v6
        with:
          name: kiosco-plus-microsoft-store
          path: release-store/*.appx

  google-play:
    if: inputs.target == 'google-play'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with: { node-version: 22 }
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - name: Preparar pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.9.0 --activate
      - run: pnpm install --frozen-lockfile
      - name: Restaurar clave de firma
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64" || { echo "Falta ANDROID_KEYSTORE_BASE64"; exit 1; }
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/kiosco-plus-upload.jks"
          test -s "$RUNNER_TEMP/kiosco-plus-upload.jks" || { echo "La clave Android está vacía"; exit 1; }
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      - run: pnpm run release:verify -- --google-play
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/kiosco-plus-upload.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      - run: pnpm run mobile:android:bundle
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/kiosco-plus-upload.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      - uses: actions/upload-artifact@v6
        with:
          name: kiosco-plus-google-play
          path: android/app/build/outputs/bundle/release/app-release.aab
