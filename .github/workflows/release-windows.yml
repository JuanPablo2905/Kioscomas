name: Publicar Kiosco+ para Windows y Mac

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Preparar pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.9.0 --activate
      - name: Verificar versión
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          test "$TAG_VERSION" = "$PACKAGE_VERSION" || (echo "La etiqueta v$TAG_VERSION no coincide con package.json ($PACKAGE_VERSION)." && exit 1)
      - run: pnpm install --frozen-lockfile
      - name: Ejecutar pruebas completas
        run: |
          pnpm run test:all
          pnpm run test:cloud
      - name: Generar notas de la versión
        run: node scripts/generate-release-notes.mjs --version "${GITHUB_REF_NAME#v}" --output release-notes.md
      - uses: actions/upload-artifact@v6
        with:
          name: release-notes
          path: release-notes.md

  create-draft:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v6
        with:
          name: release-notes
      - name: Crear versión en borrador
        run: gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --draft --title "Kiosco+ $GITHUB_REF_NAME" --notes-file release-notes.md
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}

  release-windows:
    needs: create-draft
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Preparar pnpm
        shell: pwsh
        run: |
          corepack enable
          corepack prepare pnpm@11.9.0 --activate
      - run: pnpm install --frozen-lockfile
      - name: Crear instalador de Windows
        run: pnpm run desktop:build
        env:
          CSC_LINK: ${{ secrets.WINDOWS_CERTIFICATE }}
          CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
      - name: Adjuntar instalador y metadatos
        shell: pwsh
        run: |
          $files = @("release/KioscoPlus-Setup.exe")
          foreach ($optional in @("release/KioscoPlus-Setup.exe.blockmap", "release/latest.yml")) {
            if (Test-Path -LiteralPath $optional) { $files += $optional }
          }
          gh release upload "${{ github.ref_name }}" @files --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  release-macos:
    needs: create-draft
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            label: Apple Silicon
            runner: macos-15
          - arch: x64
            label: Intel
            runner: macos-15-intel
    name: release-macos-${{ matrix.arch }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Preparar pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.9.0 --activate
      - run: pnpm install --frozen-lockfile
      - name: Preparar ícono para Mac
        run: |
          mkdir -p desktop/icon.iconset
          sips -z 16 16 desktop/icon.png --out desktop/icon.iconset/icon_16x16.png
          sips -z 32 32 desktop/icon.png --out desktop/icon.iconset/icon_16x16@2x.png
          sips -z 32 32 desktop/icon.png --out desktop/icon.iconset/icon_32x32.png
          sips -z 64 64 desktop/icon.png --out desktop/icon.iconset/icon_32x32@2x.png
          sips -z 128 128 desktop/icon.png --out desktop/icon.iconset/icon_128x128.png
          sips -z 256 256 desktop/icon.png --out desktop/icon.iconset/icon_128x128@2x.png
          sips -z 256 256 desktop/icon.png --out desktop/icon.iconset/icon_256x256.png
          sips -z 512 512 desktop/icon.png --out desktop/icon.iconset/icon_256x256@2x.png
          sips -z 512 512 desktop/icon.png --out desktop/icon.iconset/icon_512x512.png
          sips -z 1024 1024 desktop/icon.png --out desktop/icon.iconset/icon_512x512@2x.png
          iconutil -c icns desktop/icon.iconset -o desktop/icon.icns
      - name: Informar estado de firma
        run: |
          if [ -n "$CSC_LINK" ] && [ -n "$APPLE_ID" ]; then
            pnpm run release:verify -- --mac-production
          else
            echo "::warning::El DMG se generará sin firma/notarización hasta cargar los secretos de Apple indicados en docs/PUBLICAR_EN_MAC.md."
          fi
        env:
          CSC_LINK: ${{ secrets.MACOS_CERTIFICATE }}
          CSC_KEY_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      - name: Crear instalador para Mac ${{ matrix.label }}
        run: pnpm run desktop:build:mac:${{ matrix.arch }}
        env:
          CSC_LINK: ${{ secrets.MACOS_CERTIFICATE }}
          CSC_KEY_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      - name: Adjuntar instaladores de Mac ${{ matrix.label }}
        run: |
          gh release upload "$GITHUB_REF_NAME" \
            "release/KioscoPlus-Mac-${{ matrix.arch }}.dmg" \
            "release/KioscoPlus-Mac-${{ matrix.arch }}.zip" \
            --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish:
    needs: [release-windows, release-macos]
    runs-on: ubuntu-latest
    steps:
      - name: Publicar sólo cuando todos los instaladores terminaron
        run: gh release edit "$GITHUB_REF_NAME" --draft=false --latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
