name: Control de calidad continuo

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Descargar el proyecto
        uses: actions/checkout@v6
      - name: Preparar Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Preparar pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.9.0 --activate
      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile
      - name: Probar aplicación, nube y compilación
        run: |
          pnpm run test:all
          pnpm run test:cloud
