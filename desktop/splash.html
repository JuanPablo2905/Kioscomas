<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      * { box-sizing: border-box; }
      html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: transparent; }
      body { display: grid; place-items: center; transition: opacity 260ms ease, transform 260ms ease; }
      .halo { display: grid; width: 280px; height: 190px; place-items: center; border-radius: 42px; background: radial-gradient(circle, rgba(246,241,231,.98) 0%, rgba(246,241,231,.72) 52%, rgba(246,241,231,0) 76%); animation: appear 900ms cubic-bezier(.16,1,.3,1) both, breathe 1200ms 900ms ease-in-out infinite alternate; }
      .brand { width: 238px; height: auto; filter:drop-shadow(0 10px 20px rgba(42,36,30,.16)); }
      body.finish { opacity: 0; transform: scale(1.08); }
      @keyframes appear { from { opacity: 0; transform: scale(.48); } to { opacity: 1; transform: scale(1); } }
      @keyframes breathe { from { transform: scale(1); } to { transform: scale(1.025); } }
      @media (prefers-reduced-motion: reduce) { .halo { animation: none; } }
    </style>
  </head>
  <body><div class="halo"><img class="brand" src="./splash-logo.png" alt="Kiosco+"/></div></body>
</html>
