name: kioscomas-dev

services:
  api:
    build: .
    command: node server/cloud-server.mjs
    environment:
      KIOSCO_LOCAL_MODE: "1"
      KIOSCO_CLOUD_DB: /data/database.json
      PORT: "8787"
    ports:
      - "8787:8787"
    volumes:
      - kiosco-data:/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:8787/v1/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6
    restart: unless-stopped

  web:
    build: .
    command: node node_modules/vite/bin/vite.js --host 0.0.0.0 --port 5173
    ports:
      - "5173:5173"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  kiosco-data:
