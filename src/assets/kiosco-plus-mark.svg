<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-labelledby="title description">
  <title id="title">K+ — monograma principal de Kiosco+</title>
  <desc id="description">Fondo petróleo, K color papel y signo más mostaza, inclinados diez grados hacia la izquierda.</desc>
  <rect width="100" height="100" rx="20" fill="#1C4A44"/>
  <g transform="rotate(-10 50 50)" font-family="Fraunces, Georgia, serif" font-weight="900">
    <text x="46" y="70" text-anchor="middle" font-size="62" fill="#F6F1E7">K</text>
    <text x="78" y="58" text-anchor="middle" font-size="44" fill="#E3A23C">+</text>
  </g>
</svg>
